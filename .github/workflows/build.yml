name: Build

# Every push / PR builds Windows, macOS and Linux and keeps the packages as workflow artifacts.
# Pushing a tag like v0.1.0 also publishes them as a GitHub Release for direct download.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            configure: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          - name: macOS
            os: macos-14
            configure: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          - name: Linux
            os: ubuntu-24.04
            configure: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Render test
        shell: bash
        run: |
          exe=build/RenderTest_artefacts/Release/RenderTest
          [ -f "$exe.exe" ] && exe="$exe.exe"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$exe" render-test.wav 1; else "$exe" render-test.wav 1; fi

      - name: pluginval (VST3)
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            unzip -q pv.zip; PV=./pluginval.exe
          else
            curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pv.zip; PV=./pluginval.app/Contents/MacOS/pluginval
          fi
          "$PV" --strictness-level 5 --skip-gui-tests --validate "build/TerrainOscillator_artefacts/Release/VST3/Terrain Oscillator.vst3"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $A = "build/TerrainOscillator_artefacts/Release"
          $D = "dist/Terrain Oscillator"
          New-Item -ItemType Directory -Force $D | Out-Null
          Copy-Item -Recurse "$A/VST3/Terrain Oscillator.vst3" $D
          Copy-Item "$A/CLAP/Terrain Oscillator.clap" $D
          Copy-Item "$A/Standalone/Terrain Oscillator.exe" $D
          Copy-Item packaging/INSTALL-Windows.txt "$D/INSTALL.txt"
          Copy-Item LICENSE "$D/LICENSE.txt"
          Compress-Archive -Path $D -DestinationPath "dist/TerrainOscillator-${{ steps.v.outputs.version }}-Windows.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          A="build/TerrainOscillator_artefacts/Release"
          D="dist/Terrain Oscillator"
          mkdir -p "$D"
          cp -R "$A/VST3/Terrain Oscillator.vst3" "$A/AU/Terrain Oscillator.component" "$A/CLAP/Terrain Oscillator.clap" "$A/Standalone/Terrain Oscillator.app" "$D/"
          # ad-hoc signature (not notarised): see INSTALL.txt for the Gatekeeper step
          for b in "$D"/*.vst3 "$D"/*.component "$D"/*.clap "$D"/*.app; do codesign --force --deep -s - "$b"; done
          cp packaging/INSTALL-macOS.txt "$D/INSTALL.txt"; cp LICENSE "$D/LICENSE.txt"
          (cd dist && ditto -c -k --keepParent "Terrain Oscillator" "TerrainOscillator-${{ steps.v.outputs.version }}-macOS.zip")

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          A="build/TerrainOscillator_artefacts/Release"
          D="dist/Terrain Oscillator"
          mkdir -p "$D"
          cp -R "$A/VST3/Terrain Oscillator.vst3" "$A/CLAP/Terrain Oscillator.clap" "$A/Standalone/Terrain Oscillator" "$D/"
          cp packaging/INSTALL-Linux.txt "$D/INSTALL.txt"; cp LICENSE "$D/LICENSE.txt"
          tar -C dist -czf "dist/TerrainOscillator-${{ steps.v.outputs.version }}-Linux.tar.gz" "Terrain Oscillator"

      - uses: actions/upload-artifact@v4
        with:
          name: TerrainOscillator-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Terrain Oscillator ${{ github.ref_name }}
          body_path: packaging/RELEASE.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
